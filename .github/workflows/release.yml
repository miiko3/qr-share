name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например, 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "QR Share ${{ inputs.version }}" \
            --notes "Автоматический релиз. Android: app-release.apk. iOS: QRFileTransfer-iOS-device.ipa (для Sideloadly)." \
            android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-15
    needs: android
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app for device (ipa)
        working-directory: ios
        run: |
          xcodebuild \
            -project QRFileTransfer.xcodeproj \
            -scheme QRFileTransfer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          cd build/Build/Products/Release-iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R QRFileTransfer.app Payload/
          zip -r QRFileTransfer-iOS-device.ipa Payload

      - name: Upload iOS ipa to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ inputs.version }}
        run: |
          gh release upload "$VERSION" ios/build/Build/Products/Release-iphoneos/QRFileTransfer-iOS-device.ipa